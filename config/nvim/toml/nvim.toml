[[plugins]]
repo = 'lambdalisue/gin.vim'
depends = ['denops.vim']
hook_add = '''
  nnoremap <Leader>gs <Cmd>GinStatus<CR>
  nnoremap <Leader>gc <Cmd>Gin commit<CR>
  nnoremap <Leader>ga <Cmd>Gin add .<CR>
  nnoremap <Leader>gp <Cmd>Gin push<CR>
  nnoremap <Leader>gl <Cmd>GinLog<CR>
  nnoremap <Leader>gd <Cmd>GinDiff<CR>
  nnoremap <Leader>gb <Cmd>GinBranch<CR>

  " 快適な設定
  let g:gin_proxy_apply_without_confirm = 1
  
  augroup my_gin_settings
    autocmd!
    autocmd FileType gin-status nnoremap <buffer> a <Plug>(gin-action-stage)
    autocmd FileType gin-status nnoremap <buffer> u <Plug>(gin-action-unstage)
    autocmd FileType gin-status nnoremap <buffer> c <Plug>(gin-action-commit)
    autocmd FileType gin-status nnoremap <buffer> s <Plug>(gin-action-stage)
    autocmd FileType gin-status nnoremap <buffer> . <Plug>(gin-action-choice)
    autocmd FileType gin-status nnoremap <buffer> ? <Plug>(gin-action-help)
    autocmd FileType gin-status,gin-diff,gin-log,gin-branch nnoremap <buffer> q <Cmd>quit<CR>
  augroup END
'''

