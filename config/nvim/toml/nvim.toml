[[plugins]]
repo = 'folke/noice.nvim'
depends = ['nui.nvim', 'nvim-notify']
on_event = 'VimEnter'
lua_source = '''
  local status, noice = pcall(require, 'noice')
  if status then
    noice.setup({
      lsp = {
        progress = { enabled = true, view = "mini" },
        override = {
          ["vim.lsp.util.convert_input_to_markdown_lines"] = true,
          ["vim.lsp.util.stylize_markdown"] = true,
          ["cmp.entry.get_documentation"] = true,
        },
      },
      views = {
        popup = {
          win_options = {
            wrap = true,
            linebreak = true,
          },
        },
        split = {
          enter = true,
          win_options = {
            wrap = true,
            linebreak = true,
          },
        },
      },
      routes = {
        {
          filter = {
            event = "msg_show",
            any = {
              { min_height = 5 },
              { find = string.rep(".", 100) },
            },
          },
          view = "split",
        },
        {
          filter = { event = "msg_show", kind = "", find = "written" },
          view = "mini",
        },
        {
          filter = { event = "msg_showmode" },
          skip = true,
        },
      },
      presets = {
        bottom_search = true,
        command_palette = false,
        long_message_to_split = true,
        inc_rename = false,
        lsp_doc_border = false,
      },
    })

    -- Noice の split バッファで 'q' を有効にする
    vim.api.nvim_create_autocmd("FileType", {
      pattern = "noice",
      callback = function()
        vim.keymap.set("n", "q", function()
          vim.api.nvim_win_close(0, true)
        end, { buffer = true, silent = true })
      end,
    })
  end
'''

[[plugins]]
repo = 'nvim-lualine/lualine.nvim'
on_event = 'VimEnter'
lua_source = '''
  local status, lualine = pcall(require, 'lualine')
  if status then
    lualine.setup({
      sections = {
        lualine_a = {'mode'},
        lualine_b = {'branch', 'diff', 'diagnostics'},
        lualine_c = {'filename'},
        lualine_x = {
          'encoding',
          'fileformat',
          'filetype',
          {
            function() return require("noice").api.status.message.get_hl() end,
            cond = function() return require("noice").api.status.message.has() end,
          },
          {
            function() return require("noice").api.status.command.get() end,
            cond = function() return require("noice").api.status.command.has() end,
            color = { fg = "#ff9e64" },
          },
        },
        lualine_y = {'progress'},
        lualine_z = {'location'}
      },
    })
  end
'''

